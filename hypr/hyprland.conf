# This config is a STUB! This should never be generated.
# Use the default lua config from https://github.com/hyprwm/Hyprland/blob/main/example/hyprland.lua



$mainMod = SUPER
$terminal = kitty
$fileManager = thunar
$menu = rofi -show drun

# Move and resize with mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Cycle between floating windows
bind = $mainMod, Tab, cyclenext
bind = $mainMod SHIFT, Tab, cyclenext, prev

# Move floating window with keyboard
bind = $mainMod SHIFT, left, moveactive, -30 0
bind = $mainMod SHIFT, right, moveactive, 30 0
bind = $mainMod SHIFT, up, moveactive, 0 -30
bind = $mainMod SHIFT, down, moveactive, 0 30

# Resize floating window with keyboard
bind = $mainMod CTRL, left, resizeactive, -30 0
bind = $mainMod CTRL, right, resizeactive, 30 0
bind = $mainMod CTRL, up, resizeactive, 0 -30
bind = $mainMod CTRL, down, resizeactive, 0 30



# Control Center
bind = $mainMod, N, exec, swaync-client -t

bind = $mainMod, D, exec, eww open --toggle left-panel && eww open --toggle right-panel

# Apps
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, R, exec, rofi -show drun -theme ~/.config/rofi/ocean.rasi

# Window
bind = $mainMod, C, killactive,
bind = $mainMod, V, togglefloating,

# System
bind = $mainMod, L, exec, hyprlock
bind = $mainMod SHIFT, L, exec, ~/scripts/powermenu.sh

# Wallpaper
bind = SUPER, P, exec, ~/scripts/wallpaper.sh

# Screenshot
bind = , Print, exec, grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png

# Volume
exec-once = wpctl set-volume @DEFAULT_AUDIO_SINK@ 80%
exec-once = wpctl set-mute @DEFAULT_AUDIO_SINK@ 0
bind = , XF86AudioRaiseVolume, exec, ~/scripts/volume.sh up
bind = , XF86AudioLowerVolume, exec, ~/scripts/volume.sh down
bind = , XF86AudioMute, exec, ~/scripts/volume.sh mute
# Brightness
bind = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Workspaces
exec-once = eww daemon && eww open left-panel && eww open right-panel
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 1, exec, ~/scripts/workspace-switch.sh 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 2, exec, ~/scripts/workspace-switch.sh 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 3, exec, ~/scripts/workspace-switch.sh 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 4, exec, ~/scripts/workspace-switch.sh 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 5, exec, ~/scripts/workspace-switch.sh 5

exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = swaync
exec-once = wl-paste --watch cliphist store

input {
	touchpad {
		 natural_scroll = true
	}
}


# Transparency
decoration {
    rounding = 10
    active_opacity = 0.92
    inactive_opacity = 0.85
    blur {
        enabled = true
        size = 5
        passes = 3
    }
}

# Smooth animations
animations {
    enabled = true
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = wave, 0.4, 0.0, 0.2, 1.0
    bezier = drift, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 5, drift, slide
    animation = windowsOut, 1, 4, wave, slide
    animation = fade, 1, 6, wave
    animation = workspaces, 1, 6, wave, slide
    animation = border, 1, 8, wave
}


# Colors (general)
general {
    col.active_border = rgba(7ecfefcc) rgba(a8daf0aa) 45deg
    col.inactive_border = rgba(112a3e88)
    border_size = 2
    gaps_in = 6
    gaps_out = 14
}

decoration {
    rounding = 12
    active_opacity = 0.93
    inactive_opacity = 0.82
    blur {
        enabled = true
        size = 6
        passes = 3
        xray = false
        noise = 0.015
        contrast = 0.9
        brightness = 0.85
    }
}



exec-once = waybar
exec-once = awww-daemon
exec-once = sleep 2 && awww img ~/Pictures/wallpapers/ocean.jpg --transition-type wave --transition-duration 2
# Dashboard panel
# Screenshots
bind = , Print, exec, hyprshot -m output
bind = CTRL, Print, exec, hyprshot -m region
bind = CTRL SHIFT, Print, exec, hyprshot -m window

# Misc
bind = $mainMod SHIFT, F, fullscreen
bind = $mainMod SHIFT, C, centerwindow
bind = $mainMod SHIFT, O, exec, pkill waybar && waybar &
bind = $mainMod SHIFT, R, exec, hyprctl reload
bind = $mainMod SHIFT, E, exec, hyprctl dispatch exit
bind = $mainMod, F, exec, lf
exec-once = hypridle


exec-once = ~/scripts/battery.sh &


windowrule = opacity 0.92 override 0.92 override, match:title thunar= opacity 0.85 override 0.85 override, match:title thunar


layerrule = blur gtk-layer-shell
layerrule = xray 1 gtk-layer-shell
