# This config is a STUB! This should never be generated.
# Use the default lua config from https://github.com/hyprwm/Hyprland/blob/main/example/hyprland.lua



$mainMod = SUPER
$terminal = kitty
$fileManager = nautilus
$menu = rofi -show drun

bind = $mainMod, D, exec, eww open --toggle left-panel && eww open --toggle right-panel && eww open --toggle clock-panel

# Apps
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, R, exec, rofi -show drun -theme ~/.config/rofi/ocean.rasi

# Window
bind = $mainMod, C, killactive,
bind = $mainMod, V, togglefloating,

# System
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit

# Wallpaper
bind = SUPER, P, exec, ~/scripts/wallpaper.sh

# Screenshot
bind = , Print, exec, grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png

# Volume
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Brightness
bind = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Workspaces
exec-once = eww daemon && eww open left-panel && eww open right-panel && eww open clock-panel
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 1, exec, ~/scripts/workspace-switch.sh 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 2, exec, ~/scripts/workspace-switch.sh 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 3, exec, ~/scripts/workspace-switch.sh 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 4, exec, ~/scripts/workspace-switch.sh 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 5, exec, ~/scripts/workspace-switch.sh 5

exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = dunst
exec-once = wl-paste --watch cliphist store

input {
	touchpad {
		 natural_scroll = true
	}
}


# Transparency
decoration {
    rounding = 10
    active_opacity = 0.92
    inactive_opacity = 0.85
    blur {
        enabled = true
        size = 5
        passes = 3
    }
}

# Smooth animations
animations {
    enabled = true
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = wave, 0.4, 0.0, 0.2, 1.0
    bezier = drift, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 5, drift, slide
    animation = windowsOut, 1, 4, wave, slide
    animation = fade, 1, 6, wave
    animation = workspaces, 1, 6, wave, slide
    animation = border, 1, 8, wave
}


# Colors (general)
general {
    col.active_border = rgba(7ecfefcc) rgba(a8daf0aa) 45deg
    col.inactive_border = rgba(112a3e88)
    border_size = 2
    gaps_in = 6
    gaps_out = 14
}

decoration {
    rounding = 12
    active_opacity = 0.93
    inactive_opacity = 0.82
    blur {
        enabled = true
        size = 6
        passes = 3
        xray = false
        noise = 0.015
        contrast = 0.9
        brightness = 0.85
    }
}



exec-once = waybar
exec-once = awww-daemon
exec-once = awww img ~/Pictures/wallpapers/ocean.jpg --transition-type wave --transition-duration 2
# Dashboard panels

exec-once = eww daemon


windowrule = float on, match:title mid-panel
windowrule = size 460 300, match:title mid-panel
windowrule = move 340 76, match:title mid-panel

windowrule = float on, match:title clock-panel
windowrule = size 340 110, match:title clock-panel
windowrule = move 400 400, match:title clock-panel
