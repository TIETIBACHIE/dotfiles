background {
    monitor =
    path = ~/Pictures/wallpapers/ocean.jpg
    blur_passes = 3
    blur_size = 6
    brightness = 0.5
}

input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    outer_color = rgb(7ecfef)
    inner_color = rgb(0d1b2a)
    font_color = rgb(a8daf0)
    fade_on_empty = true
    placeholder_text = <i>password...</i>
    check_color = rgb(6ccf88)
    fail_color = rgb(ef6c6c)
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(a8daf0ff)
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%A, %d %B"
    color = rgba(7ecfefcc)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 20
    halign = center
    valign = center
}


